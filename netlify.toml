[build]
  publish = "."

# Security headers for the OFUSCA static site on Netlify.
# Keep these in sync with the _headers file.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: https:; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; form-action 'self' https://script.google.com https://script.googleusercontent.com; frame-src 'self' https://docs.google.com https://forms.gle https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; connect-src 'self' https://www.google.com/recaptcha/ https://script.google.com https://script.googleusercontent.com https://*.supabase.co; upgrade-insecure-requests"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=(), fullscreen=(self)"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"

# HTML, CSS and JS always revalidate, so edits show up right away.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Photos cache for 30 days. If you replace a photo, give it a new file name.
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/docs/*"
  [headers.values]
    Content-Disposition = "attachment"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex"

# Keep internal planning pages out of search results.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/member-portal.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/integrations.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Hide developer notes that sit in the publish folder.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SECURITY.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/HUMAN_VERIFICATION.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/OFUSCA_DATABASE_SETUP.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/LICENSE"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/docs/supabase-schema.sql"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/docs/google-apps-script-member-database.js"
  to = "/404.html"
  status = 404
  force = true

# Common probe paths on static sites.
[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/config/*"
  to = "/404.html"
  status = 404
